services:
  db:
    image: postgres:17-alpine
    container_name: attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mashamasoma}
      POSTGRES_DB: attendance
    ports:
      - "5433:5432"
    volumes:
      - attendance_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: attendance-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP: your app sends mail here
      - "8025:8025"   # Web UI: open http://localhost:8025

volumes:
  attendance_data: