<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Check-in confirmed</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
<h2>Check-in confirmed</h2>
<p>Hello <span th:text="${employeeName}">Name</span>,</p>
<p>
    Your arrival was recorded on <strong th:text="${date}">Monday 9 November 2026</strong>
    at <strong th:text="${time}">08:00</strong>.
</p>
<p>Shift: <span th:text="${shiftName}">Morning</span></p>
<p th:if="${late}" style="color: #b00020;">
    You arrived <strong th:text="${lateMinutes}">0</strong> minutes after the shift start.
</p>
<p th:unless="${late}" style="color: #1b7f3b;">You arrived on time.</p>
</body>
</html>
