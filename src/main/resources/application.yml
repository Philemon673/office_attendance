spring:
  application:
    name: attendance

  datasource:
    url: jdbc:postgresql://localhost:5433/attendance
    username: postgres
    password: ${DB_PASSWORD:mashamasoma}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true

  mail:
    host: localhost
    port: 1025

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: 480
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}